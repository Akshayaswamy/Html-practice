<!DOCTYPE html>
<head>
    <title>marquee</title>
</head>
<body>
   <marquee behavior="slide">courses</marquee>
   <marquee behavior="scroll">courses</marquee>
   <marquee behavior="alternate">courses</marquee>
   <marquee direction="left">courses</marquee>
   <marquee direction="right">courses</marquee>
   <marquee direction="up">courses</marquee>
   <marquee direction="down">courses</marquee>
   <marquee loop="2">courses</marquee>
   <marquee bgcolor="purple" hspace="50" vspace="30" scrollamount="30">courses</marquee>
</body>
</html>
